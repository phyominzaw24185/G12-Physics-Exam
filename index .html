<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Loading...</title></head>
<body style="font-family:sans-serif;text-align:center;padding-top:40vh;color:#333;">
<div id="msg">Loading... (တစ်ခဏစောင့်ပါ)</div>
<script>
(async function(){
  try {
    var r1 = await fetch('part1.txt');
    var r2 = await fetch('part2.txt');
    var b1 = await r1.arrayBuffer();
    var b2 = await r2.arrayBuffer();
    var dec = new TextDecoder('utf-8');
    var full = dec.decode(b1) + dec.decode(b2);
    document.open();
    document.write(full);
    document.close();
  } catch (e) {
    document.getElementById('msg').innerText = 'Error loading app: ' + e;
  }
})();
</script>
</body>
</html>
